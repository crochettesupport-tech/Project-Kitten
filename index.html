<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twisha’s Garden</title>
  <meta name="theme-color" content="#FAF8F3">
  <meta name="description" content="A little garden, made for Twisha.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29V12' stroke='%2387906C' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M16 18C9 18 5 13 5 7c7 0 11 4 11 11Z' fill='%23AEB99A' stroke='%2352634A' stroke-width='1.4' stroke-linejoin='round'/%3E%3Cpath d='M16 13c5 0 9-3 10-9-6 0-10 3-10 9Z' fill='%2387906C' stroke='%2352634A' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Fail-safe: the intro only takes over the page if its scripts really start.
       If they don't (blocked, offline, 404), the app is shown instead of a blank screen. -->
  <script>
    document.documentElement.classList.add('js');
    window.setTimeout(function () {
      if (!(window.TwishaIntro && window.TwishaIntro.started)) {
        document.documentElement.classList.remove('js');
      }
    }, 6000);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/app-placeholder.css">
</head>

<body class="is-intro">
  <noscript>
    <style>.intro, .loader { display: none !important; }</style>
  </noscript>

  <!-- Shared botanical line art (decorative) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="sprig" viewBox="0 0 160 260">
        <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M80 258C74 205 90 150 80 96 74 62 82 34 84 8"/>
          <path d="M78 214C58 212 42 198 38 178c22 0 38 14 40 36Z" fill="currentColor" fill-opacity=".16"/>
          <path d="M80 190c20-4 36-20 40-40-22 2-37 16-40 40Z" fill="currentColor" fill-opacity=".1"/>
          <path d="M80 150c-18-4-32-18-34-36 18 2 32 16 34 36Z" fill="currentColor" fill-opacity=".16"/>
          <path d="M82 120c16-4 28-18 30-34-18 2-29 16-30 34Z" fill="currentColor" fill-opacity=".1"/>
          <path d="M80 92C68 88 58 78 58 64c12 2 21 12 22 28Z" fill="currentColor" fill-opacity=".16"/>
          <path d="M82 62c10-4 18-14 18-26-10 2-17 12-18 26Z" fill="currentColor" fill-opacity=".1"/>
        </g>
        <g stroke="none">
          <circle cx="120" cy="148" r="3.2" style="fill:var(--warm-deep)"/>
          <circle cx="38" cy="176" r="2.6" style="fill:var(--warm)"/>
          <circle cx="84" cy="8" r="3.4" style="fill:var(--warm-deep)"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- ====================================================================
       APP MOUNT POINT
       The existing Twisha’s Garden application goes here. It is mounted
       straight away (hidden + inert) so it can finish booting while the
       message is being read, then it is revealed after the loading screen.
       The placeholder below only exists so this project runs on its own.
       ==================================================================== -->
  <main id="app" class="app" tabindex="-1">
    <div class="app-placeholder">
      <p class="app-placeholder__hand">welcome to</p>
      <h1 class="app-placeholder__title">Twisha’s Garden</h1>
      <p class="app-placeholder__note">Placeholder — the real garden mounts here.</p>
    </div>
  </main>

  <!-- ====================================================================
       LOADING SCREEN
       ==================================================================== -->
  <section id="loader" class="loader paper" aria-label="Loading" hidden>
    <div class="loader__inner">
      <div class="loader__graphic" id="loader-graphic"></div>
      <p class="loader__label" role="status">just a moment…</p>
    </div>
  </section>

  <!-- ====================================================================
       INTRO — a letter, one line at a time
       ==================================================================== -->
  <section id="intro" class="intro paper" aria-label="A message for Twisha">
    <svg class="sprig sprig--tl" aria-hidden="true" focusable="false"><use href="#sprig"/></svg>
    <svg class="sprig sprig--br" aria-hidden="true" focusable="false"><use href="#sprig"/></svg>

    <header class="intro__head">
      <p class="hand" id="intro-head" aria-hidden="true"></p>
    </header>

    <div class="stage">
      <div class="letter" id="letter" aria-hidden="true"></div>
      <svg class="flourish" viewBox="0 0 160 24" aria-hidden="true" focusable="false">
        <path class="flourish__line" d="M6 14C34 6 54 20 80 12s48-8 74 0"/>
        <path class="flourish__leaf" d="M80 12c-2-6 2-10 7-11 1 6-2 10-7 11Z"/>
      </svg>
      <p class="sr-only" id="intro-live" aria-live="polite"></p>
    </div>

    <footer class="intro__foot">
      <ol class="progress" id="progress" aria-hidden="true"></ol>
      <button type="button" class="next" id="next" aria-disabled="true">
        <span class="next__label">Next</span><span class="next__arrow" aria-hidden="true">→</span>
      </button>
    </footer>
  </section>

  <!-- Order matters: config → ready contract → loader graphic → intro → boot → app -->
  <script src="js/config.js"></script>
  <script src="js/app-ready.js"></script>
  <script src="js/loader-graphic.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/main.js"></script>
  <script src="js/app-placeholder.js"></script>
</body>
</html>
